[package]
name = "natural-voice-reader"
version = "0.2.0"
description = "Natural Voice Reader desktop and Android app"
license = "MIT"
edition = "2021"
rust-version = "1.90"

[lib]
# The `_lib` suffix avoids a name clash with the binary on Windows.
name = "natural_voice_reader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
bzip2 = { version = "0.5.2", default-features = false, features = ["libbz2-rs-sys"] }
dirs = "7.0.0"
piper-plus-g2p = { version = "0.5.4", default-features = false, features = ["english"] }
regex = "1.13.2"
reqwest = { version = "0.13.3", default-features = false, features = ["rustls", "gzip", "brotli", "charset", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
sherpa-onnx = "2.0.3"
tar = "0.4.46"
tauri = { version = "2", features = [] }
tokio = { version = "1.53.3", features = ["fs", "io-util", "net"] }
url = "2.5.9"


[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "0.22", default-features = false }
ndk-context = "0.1.1"
rustls-platform-verifier = "0.7.1"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
