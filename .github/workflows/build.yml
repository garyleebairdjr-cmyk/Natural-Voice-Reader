# Multi-platform installer and APK builds for Natural Voice Reader.
#
# Build-time assets:
# - src-tauri/resources/g2p_en.bin and cmudict.json are tracked in git
#   (embedded by include_bytes!); no extra download step is needed.
# - sherpa-onnx-sys downloads its prebuilt native libraries from
#   https://github.com/k2-fsa/sherpa-onnx/releases during `cargo build`.
# - KittenTTS / Kokoro / OmniVoice voice packs are fetched at runtime
#   into the user data directory, not at compile time.
#
# Signing:
# - Linux and Windows installers are unsigned.
# - macOS builds are unsigned (no Apple certificate secrets are set).
# - Android CI produces a debug-signed, installable arm64 APK.
#   To ship a release-signed APK later, add these repository secrets
#   (Settings > Secrets and variables > Actions) and extend the
#   android job to write src-tauri/gen/android/keystore.properties
#   (that file is gitignored) and drop the --debug flag:
#     ANDROID_KEYSTORE_BASE64   base64 of the .jks / .keystore file
#     ANDROID_KEYSTORE_PASSWORD
#     ANDROID_KEY_ALIAS
#     ANDROID_KEY_PASSWORD
#   Do not commit the keystore or passwords.

name: Build

on:
  push:
    branches:
      - main
      - feat/*
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  contents: read

env:
  NODE_MAJOR: "22"
  ANDROID_NDK_VERSION: "29.0.14206865"

jobs:
  desktop:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-22.04
            artifact: linux-x86_64
            rust_targets: x86_64-unknown-linux-gnu
            args: ""
            bundle_paths: |
              src-tauri/target/release/bundle/appimage/*.AppImage
              src-tauri/target/release/bundle/deb/*.deb
          - name: windows
            os: windows-latest
            artifact: windows-x64
            rust_targets: x86_64-pc-windows-msvc
            args: ""
            bundle_paths: |
              src-tauri/target/release/bundle/nsis/*.exe
              src-tauri/target/release/bundle/msi/*.msi
          - name: macos
            os: macos-latest
            artifact: macos-universal
            # One macOS runner builds both architectures (cheaper than two
            # macOS jobs). The app is left unsigned.
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin
            bundle_paths: |
              src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
              src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Full history: the build number is the commit count (scripts/build-info.mjs).
          fetch-depth: 0

      - name: Install Linux libraries
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config curl ca-certificates xz-utils wget file \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev libssl-dev libxdo-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good patchelf

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_MAJOR }}
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: desktop-${{ matrix.name }}

      - name: Install npm packages
        run: npm ci

      - name: Build desktop app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Leave Apple signing secrets unset so the macOS build stays unsigned.
        with:
          # Applies the build number (Android versionCode, macOS bundle version).
          tauriScript: node scripts/tauri.mjs
          args: ${{ matrix.args }}

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.bundle_paths }}
          if-no-files-found: error

  android:
    name: android
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Full history: the build number is the commit count (scripts/build-info.mjs).
          fetch-depth: 0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_MAJOR }}
          cache: npm

      - name: Install Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK and NDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools ndk;29.0.14206865 platforms;android-37.0 build-tools;37.0.0

      - name: Point the environment at the pinned NDK
        run: |
          ndk="${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}"
          if [ ! -d "$ndk" ]; then
            echo "NDK $ANDROID_NDK_VERSION was not installed at $ndk"
            ls -la "${ANDROID_HOME}/ndk" || true
            exit 1
          fi
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ndk" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ndk" >> "$GITHUB_ENV"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # armv7-linux-androideabi and x86_64-linux-android can be added later
          # if we also pass those targets to `tauri android build`.
          targets: aarch64-linux-android

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: android-aarch64

      - name: Re-run the sherpa-onnx build script
        # sherpa-onnx-sys downloads its Android shared libraries into
        # src-tauri/target/sherpa-onnx-prebuilt and points the linker there.
        # rust-cache restores the record that the build script already ran but
        # not that folder, so the link fails with "unable to find library
        # -lsherpa-onnx-c-api". Cleaning the crate makes Cargo run the script
        # again, which re-downloads. (Desktop builds link static libraries that
        # are bundled into the crate, so they do not need this.)
        run: cargo clean -p sherpa-onnx-sys --target aarch64-linux-android --manifest-path src-tauri/Cargo.toml

      - name: Install npm packages
        run: npm ci

      - name: Build number
        id: info
        run: node scripts/build-info.mjs --github-output

      - name: Build arm64 debug APK
        # Debug-signed and installable. See the file header for release signing.
        # scripts/tauri.mjs sets versionCode from the build number.
        run: node scripts/tauri.mjs android build --apk --ci --debug --target aarch64

      - name: Stage APK artifact
        run: |
          mkdir -p dist-ci
          mapfile -t apks < <(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' -type f | sort)
          if [ "${#apks[@]}" -eq 0 ]; then
            echo "No APK was produced"
            find src-tauri/gen/android/app/build/outputs -type f | sort || true
            exit 1
          fi
          for apk in "${apks[@]}"; do
            echo "Found $apk"
            cp -v "$apk" "dist-ci/Natural-Voice-Reader-${{ steps.info.outputs.version }}-build${{ steps.info.outputs.build }}-android-arm64-debug.apk"
          done
          ls -lh dist-ci

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: android-arm64-debug-build${{ steps.info.outputs.build }}
          path: dist-ci/*.apk
          if-no-files-found: error

  release:
    name: draft-release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [desktop, android]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f -exec ls -lh {} \;

      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
